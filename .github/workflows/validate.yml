name: Validate Content

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]

jobs:
  validate:
    name: Validate guides, categories and README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content and README sync
        run: pnpm run validate
